name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint and validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run lint checks
        shell: powershell
        run: .\tests\Invoke-Lint.ps1

  test:
    name: Pester tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester
        shell: powershell
        run: Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Run Pester tests
        shell: powershell
        run: |
          Import-Module Pester -MinimumVersion 5.5.0 -Force
          $config = New-PesterConfiguration
          $config.Run.Path = '.\tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = '.\pester-results.xml'
          Invoke-Pester -Configuration $config

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: pester-results.xml

  update-manifest:
    name: Point latest.json at this commit
    needs: [lint, test]
    # Only for a real push landing on main - never for a pull_request run (which has
    # nothing new to publish yet, and would need write access to a fork it doesn't have
    # anyway), and never for a push to any other branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate latest.json and what-this-changes.md, commit if changed
        shell: powershell
        run: |
          # This is the whole reason irm get.gr3y.io/debloat | iex ever sees a change:
          # debloat.ps1 reads latest.json from main for the commit + file hashes to fetch.
          # No version tag, no GitHub Release, no zip - every push to main that passes
          # lint+test just becomes the thing that URL fetches, immediately. Numbered
          # releases (the vX.Y.Z tags release.yml builds a zip/attestation/Release page
          # for) are a separate, deliberate, manually-triggered step - `git tag v0.x.y-beta
          # && git push origin v0.x.y-beta` - not something every commit should produce.
          #
          # (Earlier version of this job auto-created a new vX.Y.Z tag on every push and
          # relied on that tag-push to trigger release.yml. That silently never worked -
          # GitHub blocks GITHUB_TOKEN-authored pushes from triggering other workflow runs,
          # so tags kept getting created (v1.0.7..v1.0.13) but release.yml never once ran
          # for any of them, and latest.json stayed frozen at v1.0.6 while six more pushes
          # shipped invisibly. This version sidesteps the whole problem: no second workflow
          # to trigger, just a direct commit back to main in this same job.)
          $trackedNames = @('Deploy-DellOfficeSetup.ps1', 'Gr3ysUtilities.ps1', 'apps-catalog.json', 'bloat-patterns.json', 'tweaks.json', 'gr3ylabs-logo.png')
          $filesObj = [ordered]@{}
          foreach ($name in $trackedNames) {
              $path = Join-Path 'debloat' $name
              $filesObj[$name] = (Get-FileHash -Path $path -Algorithm SHA256).Hash.ToUpper()
          }
          $manifest = [ordered]@{ version = 'beta'; commit = "${{ github.sha }}"; files = $filesObj }
          ($manifest | ConvertTo-Json -Depth 4) | Set-Content -Path 'latest.json' -Encoding ASCII -NoNewline

          .\debloat\Generate-ChangesReference.ps1

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json 'docs\what-this-changes.md'
          $status = git status --porcelain
          if ($status) {
            $shortSha = "${{ github.sha }}".Substring(0, 7)
            git commit -m "Point latest.json at $shortSha and regenerate what-this-changes.md"
            git push origin main
          } else {
            Write-Host "latest.json and docs/what-this-changes.md already up to date - nothing to commit."
          }
